<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" />
    <script id="aurore-plume-early-theme">
      (function(){
        try {
          var choice=localStorage.getItem('auraster-theme')||'systeme';
          var dark=choice==='sombre'||(choice==='systeme'&&!window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.setAttribute('data-theme',dark?'dark':'light');
          document.documentElement.setAttribute('data-theme-choix',choice);
          var colors=['violet','rouge','vert','bleu','orange','rose','lime','bordeaux','azur','jaune','olive','chocolat','sauge','magenta','petrole-cuivre','prune-rouge','rose-sable','sarcelle-creme'];
          var color=localStorage.getItem('auraster-color-theme')||'violet';
          document.documentElement.setAttribute('data-color-theme',colors.indexOf(color)>=0?color:'violet');
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Aurore Plume, un atelier francophone d’écriture et de publication littéraire. Écrivez à votre rythme, gardez vos brouillons et proposez vos textes à la relecture." />
    <title>Aurore Plume — Les mots trouvent leur place</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"><div class="boot-screen"><span class="brand-sigil">a.</span><p>Aurore Plume se prépare…</p></div></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/creative-navigation.js"></script>
  </body>
</html>
