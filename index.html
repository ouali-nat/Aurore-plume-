<!doctype html>
<html lang="fr" data-theme="dark" data-color-theme="violet">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09080F">
  <meta name="description" content="Aurore Plume — un atelier libre pour écrire, créer, conserver ses brouillons et partager ses œuvres.">
  <meta name="color-scheme" content="dark light">
  <title>Aurore Plume — Les mots trouvent leur place</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    (() => {
      try {
        const root = document.documentElement;
        const theme = localStorage.getItem('auraster-theme') || 'sombre';
        const dark = theme === 'sombre' || (theme === 'systeme' && !matchMedia('(prefers-color-scheme: light)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.themeChoix = theme;
        const allowed = ['violet','rouge','vert','bleu','orange','rose','indigo','emeraude','lime','corail','bordeaux','azur','petrole-cuivre','nuit-peche','prune-rouge','terre-orange','rose-sable','sarcelle-creme','jaune','olive','chocolat','sauge','magenta'];
        const color = localStorage.getItem('auraster-color-theme') || 'violet';
        root.dataset.colorTheme = allowed.includes(color) ? color : 'violet';
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="app" aria-live="polite">
    <main class="boot-screen" role="status" aria-label="Chargement d’Aurore Plume">
      <span class="brand-sigil" aria-hidden="true">a.</span>
      <p>Aurore Plume se prépare…</p>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/creative-navigation.js"></script>
  <script>
    (() => {
      const app = document.getElementById('app');
      let failed = false;
      const showError = (message) => {
        if (failed || !app || !app.querySelector('.boot-screen')) return;
        failed = true;
        app.innerHTML = '<main class="boot-failure"><span class="boot-failure-mark">a.</span><h1>Aurore Plume n’a pas démarré</h1><p>Le chargement a été interrompu. Vos brouillons ne sont pas supprimés.</p><p class="boot-failure-detail"></p><button class="button button-primary" type="button">Réessayer le chargement</button></main>';
        app.querySelector('.boot-failure-detail').textContent = String(message || 'Erreur au démarrage').slice(0, 240);
        app.querySelector('button').addEventListener('click', () => location.reload());
      };
      addEventListener('error', (event) => showError(event.message || 'Erreur JavaScript'));
      addEventListener('unhandledrejection', (event) => showError(event.reason?.message || event.reason || 'Erreur de chargement'));
      setTimeout(() => showError('Le module principal ne répond pas. Rechargez la page.'), 9000);
    })();
  </script>
</body>
</html>
